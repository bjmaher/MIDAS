## General Settings Block
general:
  debug_mode: True
  methodology: genetic_algorithm
  code_type: PARCS343
  calc_type: single cycle
  results_directory_name: output_files
  clear_results: all_but_best

## Optimizer Block
optimization:
  population_size: 4
  number_of_generations: 2
  solution_symmetry: quarter #chromosome symmetry; octant NOT allowed for EQ cycle.
  objectives:
    cycle_length:
      goal: maximize
      weight: 1.0
    fdeltah:
      goal: less_than_target
      weight: 400.0
      target: 1.48
    pinpowerpeaking:
      goal: less_than_target
      weight: 400.0
      target: 2.1
    max_boron:
      goal: less_than_target
      weight: 1.0
      target: 1300

## Algorithm Settings
algorithm:
  selection:
    fitness: weighted
    method: tournament #tournament or roulette
  reproducer: standard
  mutation_type: mutate_by_gene
  mutation_rate: 0.90, 0.55
  crossover:
    method: uniform
    crossover_rate: 0.35
  elites: 0.10

## Fuel Assembly Parts
assembly_options:
  reflectors:
    FA250REFL:
      refl_type: all #all, radial, top, or bottom
      serial: ne512_250REFL
  fuel:
