      type: 2
      serial: ne512_200
      enrichment: 2.00 #wt%
      gad_count: 0
      gad_loading: 0
      gad_enrichment: 0
    FA250:
      type: 3
      serial: ne512_250
      enrichment: 2.50 #wt%
      gad_count: 0
      gad_loading: 0
      gad_enrichment: 0
    FA250gd:
      type: 4
      serial: ne512_250gd
      enrichment: 2.50 #wt%
      gad_count: 16
      gad_loading: 1.5
      gad_enrichment: 2.375
    FA320:
      type: 5
      serial: ne512_320
      enrichment: 3.20 #wt%
      gad_count: 0
      gad_loading: 0
      gad_enrichment: 0
    FA320gd:
      type: 6
      serial: ne512_320gd
      enrichment: 3.20 #wt%
      gad_count: 16
      gad_loading: 1.5
      gad_enrichment: 3.0400
    FA390:
      type: 5
